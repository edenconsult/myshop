<header class="print-company-header">
  <h1>{{ company.name }}</h1>
  {% if company.location %}
    <p>{{ company.location }}</p>
  {% endif %}
  {% if company.phone %}
    <p>Contact: <strong>{{ company.phone }}</strong></p>
  {% endif %}
  {% if company.email %}
    <p>Email: {{ company.email }}</p>
  {% endif %}
</header>
