<div class="flex flex-col gap-1.5">
  <div class="h-2 w-full overflow-hidden rounded-full bg-slate-200 dark:bg-slate-800"
       role="progressbar"
       aria-valuemin="0"
       aria-valuemax="100"
       aria-valuenow="{{ info.progress.percent|floatformat:0 }}">
    <div class="h-full rounded-full bg-emerald-600 transition-all duration-300 dark:bg-emerald-400"
         style="width: {{ info.progress.percent|floatformat:0 }}%"></div>
  </div>
  <div class="flex items-center justify-between gap-2 text-[11px] text-slate-500 dark:text-slate-400">
    <span class="truncate">{% if info.progress.description %}{{ info.progress.description }}{% elif info.complete %}All rows processed{% else %}Waiting for the worker…{% endif %}</span>
    <span class="tnum shrink-0 font-semibold text-slate-700 dark:text-slate-200">{{ info.progress.percent|floatformat:0 }}%</span>
  </div>
</div>
